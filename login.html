<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Login | Redstore</title>
    <link rel="stylesheet" href="login-styles-to-add.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>


<!-- Login Section  -->
<div class="login-section">
    <div class="login-box">

        <h2 class="login-title">Login to Redstore</h2>
        <p class="login-subtitle">Welcome back! Please login to your account</p>

        <!-- Success message shown after valid login -->
        <div class="success-msg" id="successMsg">Login Successful! Redirecting...</div>

        <form id="loginForm">

            <!-- Email Field -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
                <div class="error-msg" id="emailError">Please enter a valid email address</div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
                <span class="toggle-pass" id="togglePass">Show</span>
                <div class="error-msg" id="passError">Password must be at least 6 characters</div>
            </div>

            <!-- Remember + Forgot -->
            <div class="form-options">
                <label><input type="checkbox" id="remember"> Remember me</label>
                <a href="">Forgot Password?</a>
            </div>

            <!-- Submit -->
          <button><a href="index.html">Login &#8594</button></a>
        </form>

        <div class="divider">OR CONTINUE WITH</div>

        <div class="social-login">
            <div class="social-btn"><i class="fa-brands fa-google"></i> Google</div>
            <div class="social-btn"><i class="fa-brands fa-facebook"></i> Facebook</div>
        </div>

        <p class="signup-text">Don't have an account? <a href="">Sign Up</a></p>

    </div>
</div>


</script>

</body>
</html>
